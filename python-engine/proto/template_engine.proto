syntax = "proto3";

package template_engine;

option go_package = "./pb;pb";

service TemplateEngineService {
  rpc GenerateData(GenerateRequest) returns (GenerateResponse);
  rpc ValidateTemplate(ValidateRequest) returns (ValidateResponse);
}

message GenerateRequest {
  string template_json = 1;
  string context_json = 2;
  int64 count = 3;
}

message GenerateResponse {
  bool success = 1;
  string error_msg = 2;
  repeated string rows_json = 3;
  int64 total = 4;
}

message ValidateRequest {
  string template_json = 1;
}

message ValidateResponse {
  bool ok = 1;
  repeated string errors = 2;
}
